name: V1 release gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify:release
  backend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/stage-a/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend/stage-a
      - run: npm run verify:backend
      - run: git diff --exit-code -- backend/stage-a/results backend/stage-a/index-milestone backend/stage-a/performance-milestone backend/stage-b/results backend/stage-c/results backend/stage-d/results backend/stage-e/results data tests/fixtures
